<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blocked — Stay Strong</title>
  <link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <div class="container">
    <div class="shield">🛡️</div>
    <h1>Access Blocked</h1>
    <p class="site-name" id="siteName"></p>
    <p class="message">
      You are stronger than this urge.<br>
      This too shall pass. Take a breath.
    </p>

    <div class="counter-box">
      <div class="counter-label">You have been strong for</div>
      <div class="counter-value" id="daysCount">—</div>
      <div class="counter-label">days</div>
    </div>

    <div class="tips">
      <p>💡 <strong>Do something else right now:</strong></p>
      <ul>
        <li>Go for a 10-minute walk</li>
        <li>Drink a glass of cold water</li>
        <li>Do 20 push-ups</li>
        <li>Call a friend</li>
      </ul>
    </div>

    <button class="btn-back" onclick="history.back()">← Go Back</button>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
